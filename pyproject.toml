[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosap"
description = "COSAP library for NGS data analysis"
readme = "README.md"
license = { text = "MIT license" }
dynamic = ["version"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"cosap" = [
    "snakemake_workflows/*",
    "snakemake_workflows/**/*",
]

[project.scripts]
cosap = "cosap._cli:cli"

[tool.setuptools.dynamic]
version = {attr = "cosap._version.version"}

[tool.ruff]
# Set line length (Black's default is 88)
line-length = 88

# Enable import sorting (replaces isort)
[tool.ruff.lint]
select = ["I"]  # Enable isort rules

# Optional: Configure import sorting behavior
[tool.ruff.lint.isort]
known-first-party = ["your_package_name"]