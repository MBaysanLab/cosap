name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check out cosap_formats dependency
        uses: actions/checkout@v4
        with:
          repository: marifergun/cosap_formats
          token: ${{ secrets.COSAP_BUILD_TOKEN }}
          path: cosap_formats_source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./cosap_formats_source
          python -m pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run fast test suite
        run: >-
          pytest -m "not integration and not benchmark"
          --ignore=tests/test_pipelines.py

      - name: Run DNA workflow configuration tests
        run: >-
          pytest
          tests/test_pipelines.py::test_germline_dna_pipeline_includes_mitochondrial_caller_by_default
          tests/test_pipelines.py::test_somatic_dna_pipeline_includes_mitochondrial_callers_by_default
          tests/test_pipelines.py::test_somatic_dna_pipeline_reuses_normal_steps_for_multiple_tumors

  build-image:
    name: Build container image
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out COSAP
        uses: actions/checkout@v4
        with:
          path: cosap

      - name: Check out cosap_formats build source
        uses: actions/checkout@v4
        with:
          repository: marifergun/cosap_formats
          token: ${{ secrets.COSAP_BUILD_TOKEN }}
          path: cosap_formats_source
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./cosap
          build-contexts: |
            cosap_formats_source=./cosap_formats_source
          push: false
          tags: cosap-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
